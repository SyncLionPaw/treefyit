openapi: 3.0.3
info:
  title: treefyit.server
  version: 0.1.0
  description: |
    `treefyit/` 新服务接口规范。

    这份规范只描述 `treefyit.server` 当前已经实现的接口：
    - 单树构建、索引、查询、浏览、删除
    - 默认 forest 概览与搜索
    - JSON 文件 store 自动恢复

    兼容别名路径（例如 `/api/build`、`/api/tree/...`）也已保留。
servers:
  - url: http://localhost:8765
    description: Local development server

tags:
  - name: health
  - name: trees
  - name: index
  - name: search
  - name: forest
  - name: app
  - name: chat

paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      operationId: health
      responses:
        "200":
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                service: treefyit

  /api/trees:
    get:
      tags: [trees]
      summary: List registered trees
      operationId: listTrees
      responses:
        "200":
          description: Tree summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeSummary"
              example:
                - tree_id: a1b2c3
                  title: intro.md
                  node_count: 3
                  max_depth: 2
                  root_count: 1
    post:
      tags: [trees]
      summary: Build a tree from text
      operationId: createTreeFromText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildTreeRequest"
            example:
              text: "# Intro\n\nHello world.\n\n## Detail\n\nMore text."
              filename: sample.md
              summarize: false
              refine_split_threshold: 400
              refine_max_parts: 4
      responses:
        "200":
          description: Built tree summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeBuildResponse"
              example:
                tree_id: a1b2c3
                filename: sample.md
                title: sample.md
                node_count: 3
                max_depth: 2
                root_count: 1
                roots:
                  - path: "0"
                    title: Intro
                    summary: null
                    children_count: 1

  /api/trees/from-file:
    post:
      tags: [trees]
      summary: Build a tree from file upload
      operationId: createTreeFromFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                summarize:
                  type: boolean
                  default: false
                refine_split_threshold:
                  type: integer
                  minimum: 1
                refine_max_parts:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Built tree summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeBuildResponse"

  /api/build:
    post:
      tags: [trees]
      summary: Compatibility alias for tree build
      description: |
        兼容旧路径。
        - `application/json` 等价于 `POST /api/trees`
        - `multipart/form-data` 等价于 `POST /api/trees/from-file`
      operationId: buildCompat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuildTreeRequest"
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                summarize:
                  type: boolean
                refine_split_threshold:
                  type: integer
                  minimum: 1
                refine_max_parts:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Built tree summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeBuildResponse"
        "415":
          description: Unsupported content type

  /api/build/stream:
    post:
      tags: [app]
      summary: Build a tree from file upload and stream NDJSON progress
      operationId: buildStream
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                summarize:
                  type: boolean
                  default: false
                refine_split_threshold:
                  type: integer
                  minimum: 1
                refine_max_parts:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: NDJSON progress events ending with done or error
          content:
            application/x-ndjson:
              schema:
                type: string

  /api/history:
    get:
      tags: [app]
      summary: List build history
      operationId: listHistory
      responses:
        "200":
          description: Build history without raw text
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BuildHistoryItem"

  /api/build/{bid}:
    get:
      tags: [app]
      summary: Get one build record and tree
      operationId: getBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Build record
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [app]
      summary: Delete one build, tree, index, and original file
      operationId: deleteBuild
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"

  /api/build/{bid}/file:
    get:
      tags: [app]
      summary: Download original uploaded file for one build
      operationId: getBuildFile
      parameters:
        - $ref: "#/components/parameters/BuildId"
      responses:
        "200":
          description: Original file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trees/{tree_id}:
    get:
      tags: [trees]
      summary: Get one tree overview
      operationId: getTreeOverview
      parameters:
        - $ref: "#/components/parameters/TreeId"
      responses:
        "200":
          description: Tree overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeOverview"
              example:
                tree_id: a1b2c3
                title: sample.md
                node_count: 3
                max_depth: 2
                root_count: 1
                roots:
                  - path: "0"
                    title: Intro
                    summary: null
                    children_count: 1
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [trees]
      summary: Delete one tree and its index
      operationId: deleteTree
      parameters:
        - $ref: "#/components/parameters/TreeId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTreeResponse"
              example:
                ok: true
                tree_id: a1b2c3
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trees/{tree_id}/index:
    post:
      tags: [index]
      summary: Build or rebuild tree index
      operationId: createTreeIndex
      parameters:
        - $ref: "#/components/parameters/TreeId"
      responses:
        "200":
          description: Index summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeIndexMeta"
              example:
                tree_id: a1b2c3
                tree_title: sample.md
                document_count: 3
                average_document_length: 6.0
                term_count: 12
                tree_document_length: 18
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trees/{tree_id}/index/meta:
    get:
      tags: [index]
      summary: Get tree index summary
      operationId: getTreeIndexMeta
      parameters:
        - $ref: "#/components/parameters/TreeId"
      responses:
        "200":
          description: Index summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TreeIndexMeta"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trees/{tree_id}/search/nodes:
    get:
      tags: [search]
      summary: Search nodes inside one tree
      operationId: searchTreeNodes
      parameters:
        - $ref: "#/components/parameters/TreeId"
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/LimitNode"
      responses:
        "200":
          description: Ranked node hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeQueryHit"
              example:
                - tree_id: a1b2c3
                  tree_title: sample.md
                  node_id: node-2
                  path: "0.0"
                  title: Detail
                  score: 1.42
                  summary: null
                  snippet: More text.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trees/{tree_id}/nodes/{path}:
    get:
      tags: [trees]
      summary: Get one node by dotted path
      operationId: getTreeNode
      parameters:
        - $ref: "#/components/parameters/TreeId"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Node detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeDetail"
              example:
                tree_id: a1b2c3
                path: "0"
                title: Intro
                summary: null
                text: Hello world.
                children_count: 1
                children: ["0.0"]
        "404":
          $ref: "#/components/responses/NotFound"

  /api/trees/{tree_id}/children/{path}:
    get:
      tags: [trees]
      summary: List child nodes under one path
      operationId: getTreeChildren
      parameters:
        - $ref: "#/components/parameters/TreeId"
        - $ref: "#/components/parameters/Path"
      responses:
        "200":
          description: Child node previews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeChildren"
              example:
                tree_id: a1b2c3
                path: "0"
                children:
                  - path: "0.0"
                    title: Detail
                    summary: null
                    children_count: 0
        "404":
          $ref: "#/components/responses/NotFound"

  /api/forest:
    get:
      tags: [forest]
      summary: Get default forest summary
      operationId: getForest
      responses:
        "200":
          description: Forest summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForestSummary"
              example:
                forest_id: default
                tree_count: 2
                trees:
                  - tree_id: a1
                    title: first.md
                    node_count: 2
                    max_depth: 1
                    root_count: 1
                  - tree_id: b2
                    title: second.md
                    node_count: 1
                    max_depth: 0
                    root_count: 0

  /api/forest/search/trees:
    get:
      tags: [forest]
      summary: Search trees in default forest
      operationId: searchForestTrees
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/LimitTree"
      responses:
        "200":
          description: Ranked tree hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TreeQueryHit"

  /api/forest/search/nodes:
    get:
      tags: [forest]
      summary: Search nodes across default forest
      operationId: searchForestNodes
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/LimitNode"
      responses:
        "200":
          description: Ranked node hits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeQueryHit"

  /api/forest/search:
    get:
      tags: [forest]
      summary: Compatibility forest search returning tree and node hits
      operationId: searchForestCompat
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/LimitNode"
      responses:
        "200":
          description: Combined forest search result
          content:
            application/json:
              schema:
                type: object
                required: [trees, sections]
                properties:
                  trees:
                    type: array
                    items:
                      $ref: "#/components/schemas/TreeQueryHit"
                  sections:
                    type: array
                    items:
                      $ref: "#/components/schemas/NodeQueryHit"

  /api/queries:
    get:
      tags: [app]
      summary: List recent query/tool calls
      operationId: listQueries
      responses:
        "200":
          description: Recent query log
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/queries/stats:
    get:
      tags: [app]
      summary: Get query/tool usage statistics
      operationId: queryStats
      responses:
        "200":
          description: Query statistics
          content:
            application/json:
              schema:
                type: object

  /api/chat:
    post:
      tags: [chat]
      summary: Stream a retrieval-grounded chat response for one tree
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: NDJSON event stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Missing bid or tree_id

  /api/sessions:
    get:
      tags: [chat]
      summary: List chat sessions
      operationId: listSessions
      parameters:
        - name: bid
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 100
      responses:
        "200":
          description: Chat sessions
          content:
            application/json:
              schema:
                type: object

  /api/sessions/{sid}/turns:
    get:
      tags: [chat]
      summary: List chat session turns
      operationId: sessionTurns
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 200
      responses:
        "200":
          description: Session turns
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"

  /api/sessions/{sid}:
    delete:
      tags: [chat]
      summary: Delete one chat session
      operationId: deleteSession
      parameters:
        - name: sid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object

components:
  parameters:
    BuildId:
      name: bid
      in: path
      required: true
      schema:
        type: string
    TreeId:
      name: tree_id
      in: path
      required: true
      schema:
        type: string
    Path:
      name: path
      in: path
      required: true
      schema:
        type: string
      description: Dot path such as `root`, `0`, `0.0`
    Q:
      name: q
      in: query
      required: true
      schema:
        type: string
    LimitNode:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 8
    LimitTree:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 5

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorDetail"
          example:
              detail: "unknown tree_id: missing"

  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
        service:
          type: string

    ErrorDetail:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    BuildTreeRequest:
      type: object
      required: [text]
      properties:
        text:
          type: string
        filename:
          type: string
          default: document.md
        summarize:
          type: boolean
          default: false
        refine_split_threshold:
          type: integer
          minimum: 1
        refine_max_parts:
          type: integer
          minimum: 1

    ChatRequest:
      type: object
      required: [question]
      properties:
        bid:
          type: string
          nullable: true
        tree_id:
          type: string
          nullable: true
        question:
          type: string
        model:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true

    BuildHistoryItem:
      type: object
      required: [id, tree_id, filename, title, created_at, stats]
      properties:
        id:
          type: string
        tree_id:
          type: string
        filename:
          type: string
        title:
          type: string
        created_at:
          type: string
        stats:
          type: object
        cached:
          type: boolean
        error:
          nullable: true
        has_original_file:
          type: boolean
        original_file_url:
          type: string
          nullable: true

    RootNodePreview:
      type: object
      required: [path, title, children_count]
      properties:
        path:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        children_count:
          type: integer
          minimum: 0

    TreeBuildResponse:
      type: object
      required: [tree_id, filename, title, node_count, max_depth, root_count, roots]
      properties:
        tree_id:
          type: string
        filename:
          type: string
        title:
          type: string
        node_count:
          type: integer
          minimum: 1
        max_depth:
          type: integer
          minimum: 0
        root_count:
          type: integer
          minimum: 0
        roots:
          type: array
          items:
            $ref: "#/components/schemas/RootNodePreview"

    TreeSummary:
      type: object
      required: [tree_id, title, node_count, max_depth, root_count]
      properties:
        tree_id:
          type: string
        title:
          type: string
        node_count:
          type: integer
          minimum: 1
        max_depth:
          type: integer
          minimum: 0
        root_count:
          type: integer
          minimum: 0

    TreeOverview:
      allOf:
        - $ref: "#/components/schemas/TreeSummary"
        - type: object
          required: [roots]
          properties:
            roots:
              type: array
              items:
                $ref: "#/components/schemas/RootNodePreview"

    DeleteTreeResponse:
      type: object
      required: [ok, tree_id]
      properties:
        ok:
          type: boolean
        tree_id:
          type: string

    TreeIndexMeta:
      type: object
      required:
        [tree_id, tree_title, document_count, average_document_length, term_count, tree_document_length]
      properties:
        tree_id:
          type: string
        tree_title:
          type: string
        document_count:
          type: integer
          minimum: 0
        average_document_length:
          type: number
          format: float
          minimum: 0
        term_count:
          type: integer
          minimum: 0
        tree_document_length:
          type: integer
          minimum: 0

    NodeQueryHit:
      type: object
      required: [tree_id, tree_title, node_id, path, title, score, snippet]
      properties:
        tree_id:
          type: string
        tree_title:
          type: string
        node_id:
          type: string
        path:
          type: string
        title:
          type: string
        score:
          type: number
          format: float
        summary:
          type: string
          nullable: true
        snippet:
          type: string

    TreeQueryHit:
      type: object
      required: [tree_id, tree_title, score, node_count, root_titles]
      properties:
        tree_id:
          type: string
        tree_title:
          type: string
        score:
          type: number
          format: float
        node_count:
          type: integer
          minimum: 1
        root_titles:
          type: array
          items:
            type: string

    NodeDetail:
      type: object
      required: [tree_id, path, title, text, children_count, children]
      properties:
        tree_id:
          type: string
        path:
          type: string
        title:
          type: string
        summary:
          type: string
          nullable: true
        text:
          type: string
        children_count:
          type: integer
          minimum: 0
        children:
          type: array
          items:
            type: string

    NodeChildren:
      type: object
      required: [tree_id, path, children]
      properties:
        tree_id:
          type: string
        path:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/RootNodePreview"

    ForestSummary:
      type: object
      required: [forest_id, tree_count, trees]
      properties:
        forest_id:
          type: string
        tree_count:
          type: integer
          minimum: 0
        trees:
          type: array
          items:
            $ref: "#/components/schemas/TreeSummary"
