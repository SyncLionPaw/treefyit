<!DOCTYPE html>

<head><title>API Docs</title></head>
<body>
  <h1>Treefyit API</h1>
  <p>Build document trees from uploads.</p>

  <h2>Build</h2>
  <h3>POST /api/build</h3>
  <p>Upload a file and receive a nested tree.</p>

  <h3>POST /api/build/stream</h3>
  <p>Stream NDJSON progress events.</p>

  <h2>Chat</h2>
  <h3>POST /api/chat</h3>
  <p>Ask questions against a completed build.</p>

  <pre><code>{"bid": "abc", "question": "hello"}</code></pre>
