[project]
name = "treefyit"
version = "0.1.0"
description = "Tree-based document indexing — extract hierarchical tree structures from PDF and Markdown documents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.50",
    "python-dotenv>=1.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "python-multipart>=0.0.5",
    "requests>=2.28",
    "pagent>=0.2.0",
    "markitdown>=0.1.0",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
]
